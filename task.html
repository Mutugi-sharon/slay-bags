<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag Showcase</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        /* Internal CSS */
        h1 {
            font-size: 36px;
            color: darkblue;
        }

        p {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>Slay-Bags Collection</h1>
    <h2>Unique, Stylish, Impactful</h2>

    <!-- Paragraphs using inline CSS -->
    <p style="color: darkred; font-weight: bold;">Each Slay-Bag is handcrafted with care, ensuring that every piece is unique.</p>
    <p style="color: green; font-style: italic;">They are made with high-quality materials that last long and feel luxurious.</p>
    <p style="color: purple;">Owning a Slay-Bag empowers you while supporting local artisans and sustainable practices.</p>

    <!-- Image containers -->
    <div class="container">
        <img src="https://via.placeholder.com/200?text=Bag+1" alt="Bag 1">
    </div>
    <div class="container">
        <img src="https://via.placeholder.com/200?text=Bag+2" alt="Bag 2">
    </div>
    <div class="container">
        <img src="https://via.placeholder.com/200?text=Bag+3" alt="Bag 3">
    </div>
    <div class="container">
        <img src="https://via.placeholder.com/200?text=Bag+4" alt="Bag 4">
    </div>
    <div class="container">
        <img src="https://via.placeholder.com/200?text=Bag+5" alt="Bag 5">
    </div>

</body>
</html>
